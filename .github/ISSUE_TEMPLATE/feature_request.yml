name: Feature request
description: Suggest an idea for Pane
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like Pane to help?
  - type: textarea
    id: setup
    attributes:
      label: Your setup (optional)
      description: Mac, displays, docks, LED processors… anything that helps.
